<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --pulse: #FF4D2E;
      --fond: #101014;
      --texte: #f2f2f2;
    }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--fond);
      color: var(--texte);
      width: 260px;
      margin: 0;
      padding: 14px;
    }
    h1 { font-size: 15px; margin: 0 0 10px; }
    h1 span { color: var(--pulse); }
    .ligne { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
    label { font-size: 12px; }
    input[type="text"], input[type="number"] {
      background: #1a1a20; color: var(--texte); border: 1px solid #333;
      border-radius: 3px; padding: 4px 6px; width: 130px;
      font-family: "JetBrains Mono", monospace; font-size: 11px;
    }
    button {
      width: 100%; margin-top: 10px; padding: 8px;
      border: none; border-radius: 3px; cursor: pointer;
      font-weight: 600; font-size: 13px;
    }
    button.on { background: var(--pulse); color: #fff; }
    button.off { background: #2a2a32; color: var(--texte); }
    .statut { font-size: 11px; color: #999; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>NolFox <span>Proxy</span></h1>
  <div class="ligne">
    <label for="hote">Serveur</label>
    <input type="text" id="hote">
  </div>
  <div class="ligne">
    <label for="port">Port</label>
    <input type="number" id="port" min="1" max="65535">
  </div>
  <button id="bascule" class="off">Activer le proxy</button>
  <div class="statut" id="statut">Proxy inactif</div>
  <script src="popup.js"></script>
</body>
</html>
