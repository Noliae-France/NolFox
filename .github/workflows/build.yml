name: Build NolFox

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Publier une Release exige le droit d'ecriture sur le depot.
permissions:
  contents: write

jobs:
  desktop:
    # macOS a son workflow dedie : .github/workflows/dmg.yml
    name: NolFox ${{ matrix.nom }} (base Firefox ESR)
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Linux x86_64
            os: ubuntu-latest
            artefact: nolfox-linux-x86_64
            experimental: false
          - nom: Windows x86_64
            os: windows-latest
            artefact: nolfox-windows-x86_64
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque (Linux)
        if: runner.os == 'Linux'
        run: |
          # Compiler Firefox demande une quarantaine de gigaoctets ; le runner
          # n'en offre que 14 sans ce grand ménage.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/node_modules /opt/az /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/miniconda
          sudo docker system prune -af --volumes || true
          sudo apt-get clean
          df -h /

      - name: Installer nolc (release S3 Noliae)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              cd /tmp
              curl -fsSL https://noliae-nolc.s3.gra.io.cloud.ovh.net/nolc-latest-linux-x86_64.tar.gz | tar xz
              sudo install -m 0755 "$(find /tmp -maxdepth 2 -name nolc -type f | head -1)" /usr/local/bin/nolc
              nolc --version ;;
            *)
              # Pas de binaire nolc macOS/Windows publié : scripts/fetch.sh
              # bascule alors sur son repli équivalent, sans échouer.
              echo "nolc non publié pour ${{ runner.os }} : repli intégré" ;;
          esac

      - name: Récupérer les sources Firefox ESR
        shell: bash
        run: bash scripts/fetch.sh

      - name: Appliquer le branding NolFox
        shell: bash
        run: bash scripts/brand.sh

      - name: Build et packaging
        shell: bash
        env:
          # Le runner a 4 cœurs mais 16 Go : brider l'édition de liens
          # évite les arrêts brutaux pour dépassement mémoire.
          MOZ_MAKE_FLAGS: "-j3"
        run: |
          bash scripts/build.sh
          df -h /

      - name: Vérifier que le paquet Linux est complet
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ARCHIVE="$(find build/firefox-source/obj-*/dist -name '*.tar.xz' | head -1)"
          [ -n "$ARCHIVE" ] || { echo "aucune archive produite"; exit 1; }

          # Le contenu est listé une seule fois : enchaîner « tar | grep -q »
          # coupe le flux de tar et rend le résultat trompeur.
          tar tJf "$ARCHIVE" > /tmp/contenu.txt
          echo "$(wc -l < /tmp/contenu.txt) entrées dans l'archive"

          manque=0
          for attendu in \
            distribution/policies.json \
            distribution/extensions/proxy@nolfox.noliae.com.xpi \
            distribution/extensions/theme@nolfox.noliae.com.xpi \
            distribution/extensions/langpack-fr@firefox.mozilla.org.xpi \
            distribution/profile/chrome/userChrome.css \
            nolfox.cfg \
            defaults/pref/autoconfig.js; do
            if grep -qF "$attendu" /tmp/contenu.txt; then
              echo "présent : $attendu"
            else
              echo "MANQUANT : $attendu"
              manque=1
            fi
          done
          if [ "$manque" -ne 0 ]; then
            echo "--- contenu de distribution/ dans l'archive ---"
            grep -F distribution /tmp/contenu.txt || echo "(aucune entrée distribution)"
            exit 1
          fi
          # Les préférences NolFox doivent gagner sur celles de Firefox
          rm -rf /tmp/verif && mkdir -p /tmp/verif
          tar xJf "$ARCHIVE" -C /tmp/verif --wildcards '*/browser/omni.ja'
          OMNI="$(find /tmp/verif -name omni.ja | head -1)"
          [ -n "$OMNI" ] || { echo "omni.ja introuvable dans l'archive"; exit 1; }
          cd /tmp/verif
          unzip -o -q "$OMNI" "defaults/preferences/*"
          derniere="$(grep -h 'xpinstall.signatures.required' defaults/preferences/*.js | tail -1)"
          echo "$derniere" | grep -q false \
            || { echo "les signatures restent exigées : extensions désactivées au démarrage"; exit 1; }
          echo "paquet Linux complet et préférences NolFox prioritaires"

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}
          path: |
            build/firefox-source/obj-*/dist/nolfox-*.tar.*
            build/firefox-source/obj-*/dist/nolfox-*.dmg
            build/firefox-source/obj-*/dist/install/sea/nolfox-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Release GitHub (tags)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" build/firefox-source/obj-*/dist/nolfox-*.tar.* \
            --title "NolFox ${GITHUB_REF_NAME}" \
            --notes "NolFox ${GITHUB_REF_NAME}, base Firefox ESR $(cat build/VERSION_ESR)esr. Widevine actif, proxy Noliae et thème Pulse intégrés." \
            || gh release upload "${GITHUB_REF_NAME}" build/firefox-source/obj-*/dist/nolfox-*.tar.* --clobber
