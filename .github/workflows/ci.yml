name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  outillage:
    name: Outillage Nolc + scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer nolc (release S3 Noliae)
        run: |
          cd /tmp
          curl -fsSL https://noliae-nolc.s3.gra.io.cloud.ovh.net/nolc-latest-linux-x86_64.tar.gz | tar xz
          sudo install -m 0755 "$(find /tmp -maxdepth 2 -name nolc -type f | head -1)" /usr/local/bin/nolc
          nolc --version

      - name: Valider les prefs NolFox
        run: nolc run outils/verifie_prefs.nol -- prefs/nolfox.js

      - name: Extraire la version ESR upstream
        run: |
          curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json -o /tmp/pd.json
          nolc run outils/version_esr.nol -- /tmp/pd.json
          echo "ESR upstream : $(cat VERSION_ESR)"

      - name: Valider policies.json
        run: python3 -m json.tool distribution/policies.json > /dev/null

      - name: Valider les extensions (manifests + empaquetage XPI)
        run: |
          for m in extensions/*/manifest.json; do
            python3 -m json.tool "$m" > /dev/null
            python3 -c "import json,sys;d=json.load(open('$m'));assert d['browser_specific_settings']['gecko']['id'].endswith('@nolfox.noliae.com'),'id invalide'"
          done
          for ext in extensions/*/; do (cd "$ext" && zip -qrX /tmp/test.xpi . && rm /tmp/test.xpi); done
          node --check extensions/nolfox-proxy/background.js
          node --check extensions/nolfox-proxy/popup.js

      - name: Valider les icônes (formats + tailles)
        run: |
          for f in branding/firefox.icns branding/document.icns branding/nolfox.svg; do
            [ -s "$f" ] || { echo "manquant : $f"; exit 1; }
          done
          pip install --quiet pillow
          python3 - <<'EOF'
          from PIL import Image
          for s in (16, 32, 48, 64, 128, 256, 512):
              img = Image.open(f"branding/default{s}.png")
              assert img.size == (s, s), f"default{s}.png : taille {img.size}"
          ico = Image.open("branding/firefox.ico")
          print("icônes OK, ICO :", ico.size)
          EOF

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
