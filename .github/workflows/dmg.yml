name: DMG macOS

# Construit NolFox pour macOS et publie le .dmg prêt à installer.
on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier le DMG dans une Release GitHub"
        type: boolean
        default: false
  push:
    tags: ['v*']

# Publier une Release exige le droit d'ecriture sur le depot.
permissions:
  contents: write

jobs:
  dmg:
    name: NolFox.dmg (${{ matrix.arche }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arche: apple-silicon
            runner: macos-14
          - arche: intel
            runner: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Espace disque disponible
        run: df -h /

      - name: Outils de build macOS
        run: |
          brew install --quiet mercurial gnu-tar zip python@3.11 || true
          # mach de Firefox ESR n'est pas compatible avec Python 3.12+
          # (l'API ast.Constant.s a disparu) : on lui fournit Python 3.11.
          PY311="$(brew --prefix python@3.11)/bin/python3.11"
          "$PY311" -m pip install --quiet --upgrade pip setuptools wheel || true
          echo "PY311=$PY311" >> "$GITHUB_ENV"
          "$PY311" --version

      - name: Récupérer les sources Firefox ESR
        run: bash scripts/fetch.sh

      - name: Appliquer le branding NolFox (icônes, thème, proxy, prefs)
        run: bash scripts/brand.sh

      - name: Compiler et empaqueter
        run: bash scripts/build.sh

      - name: Fabriquer le DMG
        id: paquet
        run: |
          cd build/firefox-source
          VERSION="$(cat ../VERSION_ESR 2>/dev/null || echo inconnue)"

          # Le DMG est TOUJOURS reconstruit depuis l'application : celui que
          # « mach package » produit est figé avant l'ajout de la distribution
          # NolFox (proxy, thème, langue française, policies).
          APP="$(find obj-*/dist -maxdepth 2 -name 'NolFox.app' | head -1)"
          [ -n "$APP" ] || { echo "aucune application construite"; exit 1; }
          [ -d "$APP/Contents/Resources/distribution/extensions" ] \
            || { echo "distribution NolFox absente de l'application"; exit 1; }

          STAGING="$(mktemp -d)/NolFox"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          DMG_SRC="$(mktemp -d)/NolFox.dmg"
          hdiutil create -volname "NolFox" -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG_SRC"

          NOM="NolFox-${VERSION}-${{ matrix.arche }}.dmg"
          mkdir -p "$GITHUB_WORKSPACE/livraison"
          cp "$DMG_SRC" "$GITHUB_WORKSPACE/livraison/$NOM"
          cd "$GITHUB_WORKSPACE/livraison"
          shasum -a 256 "$NOM" > "$NOM.sha256"
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh

      - name: Vérifier que le DMG est montable
        run: |
          cd livraison
          hdiutil attach "${{ steps.paquet.outputs.nom }}" -nobrowse -mountpoint /tmp/nolfox-dmg
          ls -la /tmp/nolfox-dmg
          test -d /tmp/nolfox-dmg/NolFox.app || { echo "application absente"; exit 1; }
          # Le DMG doit contenir tout ce qui fait NolFox, pas un Firefox nu
          DIST=/tmp/nolfox-dmg/NolFox.app/Contents/Resources/distribution
          test -f "$DIST/policies.json" || { echo "policies absentes"; exit 1; }
          test -f "$DIST/extensions/proxy@nolfox.noliae.com.xpi" || { echo "proxy absent"; exit 1; }
          test -f "$DIST/extensions/theme@nolfox.noliae.com.xpi" || { echo "thème absent"; exit 1; }
          test -f "$DIST/extensions/langpack-fr@firefox.mozilla.org.xpi" || { echo "langue française absente"; exit 1; }
          test -f "$DIST/profile/chrome/userChrome.css" || { echo "habillage absent"; exit 1; }
          RES=/tmp/nolfox-dmg/NolFox.app/Contents/Resources
          test -f "$RES/nolfox.cfg" || { echo "configuration automatique absente"; exit 1; }
          test -f "$RES/defaults/pref/autoconfig.js" || { echo "activation de la configuration absente"; exit 1; }
          echo "DMG complet : proxy, thème, français, policies et habillage présents"
          hdiutil detach /tmp/nolfox-dmg

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: nolfox-dmg-${{ matrix.arche }}
          path: livraison/*
          if-no-files-found: error
          retention-days: 30

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="dmg-${{ steps.paquet.outputs.version }}" ;; esac
          gh release create "$TAG" livraison/* \
            --title "NolFox $TAG" \
            --notes "NolFox pour macOS (${{ matrix.arche }}), base Firefox ESR ${{ steps.paquet.outputs.version }}esr. Widevine actif, proxy Noliae et thème Pulse intégrés." \
            || gh release upload "$TAG" livraison/* --clobber
