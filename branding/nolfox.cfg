// Configuration automatique NolFox (mecanisme autoconfig de Mozilla).
// La premiere ligne est ignoree par Firefox : ne rien y ecrire d'utile.
//
// Role : installer l'habillage Pulse dans le profil au premier demarrage.
// Un theme d'extension ne peut pas agir sur les formes de l'interface ;
// userChrome.css le peut, mais il doit vivre dans le profil de l'utilisateur.

try {
  const { classes: Cc, interfaces: Ci } = Components;
  const repertoires = Cc["@mozilla.org/file/directory_service;1"].getService(
    Ci.nsIProperties
  );

  const profil = repertoires.get("ProfD", Ci.nsIFile);
  const dossierChrome = profil.clone();
  dossierChrome.append("chrome");

  const cible = dossierChrome.clone();
  cible.append("userChrome.css");

  // On n'ecrase jamais un habillage que l'utilisateur aurait personnalise.
  if (!cible.exists()) {
    const source = repertoires.get("GreD", Ci.nsIFile);
    source.append("distribution");
    source.append("profile");
    source.append("chrome");
    source.append("userChrome.css");

    if (source.exists()) {
      if (!dossierChrome.exists()) {
        dossierChrome.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
      }
      source.copyTo(dossierChrome, "userChrome.css");
    }
  }
} catch (e) {
  // Un habillage absent ne doit jamais empecher le navigateur de demarrer.
  Components.utils.reportError("NolFox : habillage non installe, " + e);
}
